<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Foreman — design system & screens</title>

<!-- Fonts: serif (display+prompt), sans (UI), mono (metadata) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  body { font-family: "IBM Plex Sans", -apple-system, system-ui, sans-serif; color: #1A1816; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  @keyframes fm-spin { to { transform: rotate(360deg); } }
  @keyframes fm-blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>

<body>
<div id="root"></div>

<!-- Starter components first (define Window globals) -->
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>

<!-- Foreman tokens + primitives -->
<script type="text/babel" src="src/tokens.jsx"></script>
<script type="text/babel" src="src/primitives.jsx"></script>
<script type="text/babel" src="src/shell.jsx"></script>

<!-- Screen groups -->
<script type="text/babel" src="src/screens-system.jsx"></script>
<script type="text/babel" src="src/screens-onboarding.jsx"></script>
<script type="text/babel" src="src/screens-checkin.jsx"></script>
<script type="text/babel" src="src/screens-home.jsx"></script>
<script type="text/babel" src="src/screens-library.jsx"></script>
<script type="text/babel" src="src/screens-retro.jsx"></script>
<script type="text/babel" src="src/breakdowns.jsx"></script>

<!-- App entry, last -->
<script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
